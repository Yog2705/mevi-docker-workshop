apiVersion: apps/v1
kind: Deployment

metadata:
  name: mevi-web

spec:
  replicas: 2
  selector:
    matchLabels:
      app: mevi-web
  template:
    metadata:
      labels:
        app: mevi-web
    spec:
      containers:
        - name: mevi-web
          image: mevi-web:v1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          ports:
            - containerPort: 80